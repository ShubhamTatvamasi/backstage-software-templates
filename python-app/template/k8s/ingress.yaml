apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{values.app_name}}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  tls:
  - hosts:
      - ${{values.app_name}}.${{values.app_env}}.aws.shubhamtatvamasi.com
    secretName: ${{values.app_name}}-tls
  rules:
  - host: ${{values.app_name}}.${{values.app_env}}.aws.shubhamtatvamasi.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ${{values.app_name}}
            port:
              number: 8080
